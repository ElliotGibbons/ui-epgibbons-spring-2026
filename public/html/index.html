<!DOCTYPE html>
<html>
<head>
  <title>Simple Map</title>
  <style>
    #map {
      height: 500px;
      width: 100%;
    }
  </style>
</head>
<body>

<h2>My First Map</h2>
<div id="map"></div>

<script>
  function initMap() {
    const location = { lat: 39.7392, lng: -104.9903 }; // Denver

    const map = new google.maps.Map(document.getElementById("map"), {
      zoom: 12,
      center: location,
    });

    new google.maps.Marker({
      position: location,
      map: map,
    });
  }
</script>

<script async
  src="https://maps.googleapis.com/maps/api/js?key=AIzaSyCgicWPekLWaA8WSURdoEPfrRbYJ7UD6As&callback=initMap">
</script>

</body>
</html>
